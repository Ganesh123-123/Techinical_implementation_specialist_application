services:
  # -------------------------------------------------------------------------
  # 1. FastAPI Backend Service (Python Web Service)
  # -------------------------------------------------------------------------
  - type: web
    name: sunrise-interiors-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./sunrise_interiors.db
      - key: CORS_ORIGINS
        value: "*"

  # -------------------------------------------------------------------------
  # 2. React + Vite Frontend (Responsive Global Static Site CDN)
  # -------------------------------------------------------------------------
  - type: web
    name: sunrise-interiors-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sunrise-interiors-api.onrender.com
